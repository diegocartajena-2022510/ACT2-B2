<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>principal</title>
    <link rel="stylesheet" href="usuario.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<header>
    <h1>Nanotech</h1>
    <div class="nav">
        <ul>
            <li>inicio</li>
            <li>quienes somos</li>
            <li>contacto</li>
        </ul>
        <form th:action="@{/principal}" method="get">
            <button type="submit"><p>regresar</p></button>
        </form>
        
    </div>
</header>
<body>
    <table>
        <thead>
            <tr>
                <th>Código Usuario</th>
                <th>Username</th>
                <th>Password</th>
                <th>email</th>
                <th>Rol</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.codigo_usuario}"></td> 
                <td th:text="${u.username}"></td>
                <td th:text="${u.pasword}"></td> 
                <td th:text="${u.email}"></td>
                <td th:text="${u.rol}"></td>
                <td th:text="${u.estado}"></td>
            </tr>
        </tbody>
    </table>
    <div class="crud">
        <div class="boton-crud">
            <button type="submit" id="botonC">agregar</button>
             <button type="submit" id="botonC">editar</button>
             <button type="submit" id="botonC">buscar</button>
        </div>

        <div class="campos">
            <p>codigo de usuario</p>
            <input type="text" name="codigoU">
            <p>username</p>
            <input type="text" name="usuario">
            <p>contrasena</p>
            <input type="password" name="password" required>
            
        </div>
        <div class="campos">
            <p>email</p>
            <input type="text" name="email" required>
            <p>rol</p>
            <input type="text" name="rol" required>
            <p>estado</p>
            <input type="text" name="estado" required>
        </div>

        
    </div>


</body>
</html>
