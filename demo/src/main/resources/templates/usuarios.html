<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>usuarios</title>
    <link rel="stylesheet" href="usuario.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<header>
    <h1>Nanotech</h1>
    <div class="nav">
        <ul>
            <li>inicio</li>
            <li>quienes somos</li>
            <li>contacto</li>
        </ul>
        <form th:action="@{/principal}" method="get">
            <button type="submit"><p>regresar</p></button>
        </form>
        
    </div>
</header>
<body>
<table>
    <thead>
    <tr>
        <th>Código Usuario</th>
        <th>Username</th>
        <th>Password</th>
        <th>Email</th>
        <th>Rol</th>
        <th>Estado</th>
        <th>Acciones</th> </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${usuarios}">
        <td th:text="${u.codigo_usuario}"></td>
        <td th:text="${u.username}"></td>
        <td th:text="${u.pasword}"></td>
        <td th:text="${u.email}"></td>
        <td th:text="${u.rol}"></td>
        <td th:text="${u.estado}"></td>
        <td>
            <a th:href="@{/usuarios(accion='editar', id=${u.codigo_usuario})}"class="btn-editar-tabla">Editar</a>
            <a th:href="@{/usuarios/eliminar/{id}(id=${u.codigo_usuario})}" class="btn-eliminar-tabla" onclick="return confirm('¿Seguro?')">Borrar</a>
        </td>
    </tr>
    </tbody>
</table>

<div class="crud">
    <div class="boton-crud">
        <a th:href="@{/usuarios(accion='agregar')}" id="botonC" class="btn-fake">Agregar Nuevo</a>
        <a th:href="@{/usuarios(accion='buscar')}" id="botonC" class="btn-fake">Buscar</a>
    </div>

    <div class="modal-overlay" th:if="${accion != null}">

        <div class="modal-content" th:if="${accion == 'agregar'}">
            <a th:href="@{/usuarios}" class="close">&times;</a>
            <h2>Registrar Usuario</h2>
            <form th:action="@{/usuarios/guardar}" method="post">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="pasword" placeholder="Password" required>
                <input type="email" name="email" placeholder="Email">
                <input type="text" name="rol" placeholder="Rol">
                <input type="text" name="estado" placeholder="Estado">
                <button type="submit">Guardar</button>
            </form>
        </div>

        <div class="modal-content" th:if="${accion == 'editar'}">
            <a th:href="@{/usuarios}" class="close">&times;</a>
            <h2>Editar Usuario</h2>
            <form th:action="@{/usuarios/editar}" method="post">
                <input type="hidden" name="codigo_usuario" th:value="${uEncontrado?.codigo_usuario}">

                <p>Username</p>
                <input type="text" name="username" th:value="${uEncontrado?.username}">

                <p>Email</p>
                <input type="email" name="email" th:value="${uEncontrado?.email}">

                <p>Rol</p>
                <input type="text" name="rol" th:value="${uEncontrado?.rol}">

                <p>Estado</p>
                <input type="text" name="estado" th:value="${uEncontrado?.estado}">

                <button type="submit">Actualizar</button>
            </form>
        </div>

        <div class="modal-content" th:if="${accion == 'buscar'}">
            <a th:href="@{/usuarios}" class="close">&times;</a>
            <h2>Buscar por Código</h2>
            <form th:action="@{/usuarios/buscar}" method="post">
                <input type="number" name="codigo_usuario" placeholder="ID a buscar" required>
                <button type="submit">Buscar</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
